[chttpd]
enable_cors = true
require_valid_user = true

[cors]
credentials = true
origins = app://gestore-attivita-kanban,capacitor://localhost,http://localhost:*,https://localhost:*,file://,null
methods = GET, PUT, POST, HEAD, DELETE, OPTIONS
headers = accept, authorization, content-type, origin, referer, access-control-request-method, access-control-request-headers, x-requested-with

[httpd]
WWW-Authenticate = Basic realm="Gestore attivita Kanban"

[couch_httpd_auth]
same_site = none
