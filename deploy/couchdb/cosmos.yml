services:
  couchdb:
    image: couchdb:3.3
    container_name: kanban-couchdb
    user: couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      NODENAME: 127.0.0.1
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./local.ini:/opt/couchdb/etc/local.d/kanban.ini:ro
    ports:
      - "127.0.0.1:5985:5984"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"$${COUCHDB_USER}:$${COUCHDB_PASSWORD}\" http://127.0.0.1:5984/_up"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - cosmos-persistent=true
      - cosmos-name=kanban-couchdb
      - cosmos-url=${COUCHDB_DOMAIN}
      - cosmos-port=5984
      - cosmos-ssl=true
      - cosmos-ssl-redirect=true

volumes:
  couchdb_data:
    name: ${COUCHDB_VOLUME:-couchdb_couchdb_data}
