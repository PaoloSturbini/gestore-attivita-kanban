name: Deploy Kanban to X1 Pro

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kanban-x1pro-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, x1pro]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy only on X1 Pro
        env:
          APP_REVISION: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          deploy_dir=/srv/repos/gestore-attivita-kanban
          test "$(hostname -s)" = x1pro
          test -d "$deploy_dir/.git"
          test -f "$deploy_dir/deploy/couchdb/.env"
          test -f "$deploy_dir/deploy/portal/.env"

          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'deploy/couchdb/.env' \
            --exclude 'deploy/portal/.env' \
            --exclude 'deploy/portal/users.json' \
            ./ "$deploy_dir"/
          git -C "$deploy_dir" fetch --quiet "$GITHUB_WORKSPACE" "$APP_REVISION"
          git -C "$deploy_dir" update-ref refs/remotes/origin/main FETCH_HEAD
          git -C "$deploy_dir" reset --mixed origin/main >/dev/null
          test -z "$(git -C "$deploy_dir" status --porcelain)"
          echo "GIT-MIRROR: clean"

          cd "$deploy_dir"
          docker compose --env-file deploy/couchdb/.env -f deploy/couchdb/cosmos.yml up -d --remove-orphans
          bash deploy/couchdb/init-kanban-db.sh
          docker compose --env-file deploy/portal/.env -f deploy/portal/docker-compose.yml up -d --remove-orphans

          set -a
          . deploy/couchdb/.env
          set +a
          couch_ok=0
          portal_ok=0
          for _ in $(seq 1 30); do
            curl -fsS --max-time 5 -u "$COUCHDB_USER:$COUCHDB_PASSWORD" \
              http://127.0.0.1:5985/_up | grep -q '"ok"' && couch_ok=1 || true
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8787/ || true)
            [ "$code" = 200 ] && portal_ok=1
            [ "$couch_ok" = 1 ] && [ "$portal_ok" = 1 ] && break
            sleep 2
          done
          test "$couch_ok" = 1
          test "$portal_ok" = 1
          unset COUCHDB_USER COUCHDB_PASSWORD KANBAN_DB_PASSWORD
          echo "DEPLOY-RESULT: success revision=$APP_REVISION target=x1pro"
