name: Deploy Kanban to X1 Pro

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kanban-x1pro-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, x1pro]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy only on X1 Pro
        env:
          APP_REVISION: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          deploy_dir=/srv/repos/gestore-attivita-kanban
          test "$RUNNER_NAME" = x1pro-kanban
          if ! git -C "$deploy_dir" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            mkdir -p "$deploy_dir"
            git -C "$deploy_dir" init --quiet
            echo "GIT-MIRROR: initialized on x1pro"
          fi
          mkdir -p "$deploy_dir/deploy/couchdb" "$deploy_dir/deploy/portal"
          if [ -f "$deploy_dir/deploy/couchdb/.env" ]; then couch_state=present; else couch_state=missing; fi
          if [ -f "$deploy_dir/deploy/portal/.env" ]; then portal_state=present; else portal_state=missing; fi
          if docker inspect kanban-couchdb >/dev/null 2>&1; then couch_container=present; else couch_container=missing; fi
          if docker inspect kanban-portal >/dev/null 2>&1; then portal_container=present; else portal_container=missing; fi
          echo "CONFIG-STATE: couchdb=$couch_state portal=$portal_state containers=$couch_container/$portal_container"

          container_value() {
            docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$1" 2>/dev/null \
              | sed -n "s/^$2=//p" | head -n 1
          }
          append_env() {
            test -n "$3"
            case "$3" in *"'"*|*$'\n'*) return 1 ;; esac
            printf "%s='%s'\n" "$2" "$3" >> "$1"
          }

          if [ ! -f "$deploy_dir/deploy/couchdb/.env" ]; then
            umask 077
            couch_admin=$(container_value kanban-couchdb COUCHDB_USER)
            couch_admin_password=$(container_value kanban-couchdb COUCHDB_PASSWORD)
            app_user=$(container_value kanban-portal COUCHDB_USER)
            app_password=$(container_value kanban-portal COUCHDB_PASSWORD)
            couch_env="$deploy_dir/deploy/couchdb/.env.migrate"
            : > "$couch_env"
            append_env "$couch_env" COUCHDB_DOMAIN pstdb.pst.my
            append_env "$couch_env" COUCHDB_USER "$couch_admin"
            append_env "$couch_env" COUCHDB_PASSWORD "$couch_admin_password"
            append_env "$couch_env" KANBAN_DB_NAME gestore-attivita-kanban
            append_env "$couch_env" KANBAN_DB_USER "$app_user"
            append_env "$couch_env" KANBAN_DB_PASSWORD "$app_password"
            append_env "$couch_env" COUCHDB_URL http://127.0.0.1:5985
            mv "$couch_env" "$deploy_dir/deploy/couchdb/.env"
            echo "CONFIG-MIGRATION: recovered CouchDB configuration on x1pro"
          fi

          if [ ! -f "$deploy_dir/deploy/portal/.env" ]; then
            umask 077
            portal_env="$deploy_dir/deploy/portal/.env.migrate"
            : > "$portal_env"
            for key in PORT PUBLIC_URL SESSION_SECRET SESSION_MAX_AGE_HOURS COOKIE_SECURE COUCHDB_URL COUCHDB_DB COUCHDB_USER COUCHDB_PASSWORD PORTAL_USERS PORTAL_USERS_FILE; do
              value=$(container_value kanban-portal "$key")
              [ -z "$value" ] || append_env "$portal_env" "$key" "$value"
            done
            test -s "$portal_env"
            mv "$portal_env" "$deploy_dir/deploy/portal/.env"
            echo "CONFIG-MIGRATION: recovered portal configuration on x1pro"
          fi

          test -f "$deploy_dir/deploy/couchdb/.env"
          test -f "$deploy_dir/deploy/portal/.env"

          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'deploy/couchdb/.env' \
            --exclude 'deploy/portal/.env' \
            --exclude 'deploy/portal/users.json' \
            ./ "$deploy_dir"/
          git -C "$deploy_dir" fetch --quiet "$GITHUB_WORKSPACE" "$APP_REVISION"
          git -C "$deploy_dir" update-ref refs/remotes/origin/main FETCH_HEAD
          git -C "$deploy_dir" reset --mixed origin/main >/dev/null
          test -z "$(git -C "$deploy_dir" status --porcelain)"
          echo "GIT-MIRROR: clean"

          cd "$deploy_dir"
          docker compose --env-file deploy/couchdb/.env -f deploy/couchdb/cosmos.yml up -d --remove-orphans
          bash deploy/couchdb/init-kanban-db.sh
          docker compose --env-file deploy/portal/.env -f deploy/portal/docker-compose.yml up -d --remove-orphans

          set -a
          . deploy/couchdb/.env
          set +a
          couch_ok=0
          portal_ok=0
          for _ in $(seq 1 30); do
            curl -fsS --max-time 5 -u "$COUCHDB_USER:$COUCHDB_PASSWORD" \
              http://127.0.0.1:5985/_up | grep -q '"ok"' && couch_ok=1 || true
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8787/ || true)
            [ "$code" = 200 ] && portal_ok=1
            [ "$couch_ok" = 1 ] && [ "$portal_ok" = 1 ] && break
            sleep 2
          done
          test "$couch_ok" = 1
          test "$portal_ok" = 1
          unset COUCHDB_USER COUCHDB_PASSWORD KANBAN_DB_PASSWORD
          echo "DEPLOY-RESULT: success revision=$APP_REVISION target=x1pro"
